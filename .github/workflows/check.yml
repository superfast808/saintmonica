name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies without native build scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate server, browser JavaScript and EJS templates
        run: npm run check

      - name: Build production Docker image
        run: docker build -t saintmonica-check .

      - name: Smoke-test public routes
        run: |
          docker run -d --name saintmonica-smoke \
            -p 127.0.0.1:18080:8080 \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e BASE_URL=https://saint-monica.org.uk \
            -e SESSION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef \
            -e ADMIN_EMAIL=ci@example.org \
            -e ADMIN_PASSWORD=ci-test-password-123456 \
            -v "$PWD/wp-content:/app/wp-content:ro" \
            saintmonica-check
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl -fsS -o /tmp/home.html http://127.0.0.1:18080/
          curl -fsS -o /tmp/bulletins.html http://127.0.0.1:18080/bulletins
          test -s /tmp/home.html
          test -s /tmp/bulletins.html
          grep -q "Weekly bulletins" /tmp/bulletins.html

      - name: Validate SEO output
        run: |
          curl -fsS -o /tmp/home.html http://127.0.0.1:18080/
          curl -fsS -o /tmp/sitemap.xml http://127.0.0.1:18080/sitemap.xml
          curl -fsS -o /tmp/robots.txt http://127.0.0.1:18080/robots.txt
          grep -q 'application/ld+json' /tmp/home.html
          grep -q 'https://schema.org' /tmp/home.html
          grep -q 'https://www.facebook.com/StMonicasRC/' /tmp/home.html
          grep -q '<loc>https://saint-monica.org.uk/</loc>' /tmp/sitemap.xml
          grep -q 'Sitemap: https://saint-monica.org.uk/sitemap.xml' /tmp/robots.txt
          docker logs saintmonica-smoke
