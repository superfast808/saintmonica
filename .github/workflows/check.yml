name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies without native build scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate server, browser JavaScript and EJS templates
        run: npm run check
